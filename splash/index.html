<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Locale Drive</title>
    <style>
        :root {
            color-scheme: light dark;
            --bg: #f6f7f9;
            --fg: #1c1f24;
            --muted: #6b7280;
            --accent: #3b82f6;
            --error: #dc2626;
            --panel: #ffffff;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #111317;
                --fg: #e8eaed;
                --muted: #9aa0a6;
                --error: #f87171;
                --panel: #1b1e23;
            }
        }

        * { box-sizing: border-box; }

        html, body {
            height: 100%;
            margin: 0;
        }

        body {
            display: grid;
            place-items: center;
            background: var(--bg);
            color: var(--fg);
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
            user-select: none;
        }

        main {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            max-width: 640px;
            padding: 24px;
            text-align: center;
        }

        img { width: 72px; height: 72px; }

        h1 { margin: 0; font-size: 20px; font-weight: 600; }

        p { margin: 0; color: var(--muted); font-size: 14px; }

        .spinner {
            width: 22px;
            height: 22px;
            border: 3px solid color-mix(in srgb, var(--accent) 25%, transparent);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        pre {
            width: 100%;
            max-height: 260px;
            overflow: auto;
            margin: 0;
            padding: 12px;
            border-radius: 8px;
            background: var(--panel);
            color: var(--fg);
            font-size: 12px;
            text-align: left;
            white-space: pre-wrap;
            user-select: text;
        }

        .error h1 { color: var(--error); }
        .error .spinner { display: none; }
        pre, .error .loading { display: none; }
        .error pre { display: block; }
    </style>
</head>
<body>
    <main>
        <img src="icon.png" alt="">
        <h1>Locale Drive</h1>
        <div class="spinner"></div>
        <p class="loading">Starting the server…</p>
        <pre></pre>
    </main>

    <script>
        // The app opens this page while the server starts. If the server fails, it comes
        // back here with what the server printed in the URL hash (see src-tauri/src/main.rs)
        if (location.hash.length > 1) {
            document.body.classList.add('error');
            document.querySelector('h1').textContent = 'The server stopped';
            document.querySelector('pre').textContent = decodeURIComponent(location.hash.slice(1));
        }
    </script>
</body>
</html>
